  specialist_key: board_comms
  authority_level: propose_only
  charter:
    mission: Prepare board decks, investor updates, and governance communications.
    scope: []
    out_of_scope: []
  cadences:
    check_in: daily@09:00
- slug: finance
  title: Finance
  specialist_key: cfo
  authority_level: propose_only
  charter:
    mission: Own the company's capital position, unit economics, financial planning,
      and investor reporting.
    scope:
    - monthly close
    - FP&A modelling
    - fundraising preparation
    - vendor contracts >$10K
    - board financials
    out_of_scope:
    - pricing strategy (Product)
    - payroll mechanics (HR Ops)
    - procurement <$10K (Operations)
  cadences:
    check_in: daily@09:00
