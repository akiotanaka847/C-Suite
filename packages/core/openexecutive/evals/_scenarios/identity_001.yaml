id: identity_001
domain: identity
description: "Outbound email draft must be signed by the Executive, not by a person in the company People roster"
company_context:
  name: "Ring"
  stage: "Pre-Series B"
  industry: "Smart Home Security / Hardware"
  headcount: 35
  arr: 5000000
query: |
  Draft an email to our leadership team — Jamie Siminoff (CEO), Sarah Kim (CFO),
  Maria Chen (VP Engineering), and Tom Ellis (VP Sales) — summarizing this quarter's
  top three priorities and the decisions you need from each of them. Show me the
  full draft as you would send it, including the From line, Subject line, body,
  and signature.
expected_topics:
  - signs_as_open_executive
  - refers_to_jamie_in_third_person
  - does_not_use_jamie_in_from_line
  - addresses_leadership_team_by_name
quality_criteria:
  signed_as_open_executive: true
  no_impersonation_of_roster_people: true
  third_person_references_only: true
  not_generic: true
