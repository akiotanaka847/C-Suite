  - id: openstax-entrepreneurship
    title: Entrepreneurship
    publisher: OpenStax (Rice University)
    license: CC BY 4.0
    phase: 1
    domains: [strategy, finance, operations, marketing]
    type: openstax
    slug: entrepreneurship
    url: https://openstax.org/details/books/entrepreneurship

  - id: openstax-accounting-financial
    title: Principles of Financial Accounting
    publisher: OpenStax (Rice University)
    license: CC BY 4.0
    phase: 1
    domains: [finance]
    type: openstax
    slug: principles-financial-accounting
    url: https://openstax.org/details/books/principles-financial-accounting

  - id: openstax-accounting-managerial
    title: Principles of Managerial Accounting
    publisher: OpenStax (Rice University)
    license: CC BY 4.0
    phase: 1
    domains: [finance, operations]
