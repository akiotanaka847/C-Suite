# Open Educational Resources manifest for the executive knowledge base.
#
# Phase 1: CC BY / CC0 / public domain — safe to redistribute embedded chunks.
# Phase 2: CC BY-SA / CC BY-NC-SA / MIT — safe to ingest; share-alike or
#          non-commercial restrictions may apply to downstream redistribution.
#
# Each source is fetched into knowledge/external/<id>/ (gitignored), text is
# extracted, chunked, and upserted into the builtin_knowledge ChromaDB
# collection so the existing retriever picks it up. Re-running is idempotent
# (deterministic chunk ids upsert in place).
#
# Run with:
#   openexecutive ingest-oer            # both phases
#   openexecutive ingest-oer --phase 1  # CC BY / public domain only
#   openexecutive ingest-oer --source openstax-finance --force
#
# To add a new source: append an entry with a unique `id`, a verified `url`,
# the correct `license`, target `domains` (must match knowledge/builtin/*),
# and `type` (pdf | html | git).

sources:
  # ---- Phase 1: CC BY 4.0 (OpenStax) ------------------------------------
  #
  # OpenStax sources resolve the live high-resolution PDF URL via their CMS
  # API at fetch time (https://openstax.org/apps/cms/api/v2/pages/...), so
  # the slug is the stable identifier — asset URLs change as books are
  # republished. The `url` field below points at the human-facing book page
  # for documentation only.

  - id: openstax-intro-business
    title: Introduction to Business
    publisher: OpenStax (Rice University)
    license: CC BY 4.0
    phase: 1
    domains: [strategy, operations, finance, marketing, hr]
    type: openstax
    slug: introduction-business
    url: https://openstax.org/details/books/introduction-business

  - id: openstax-finance
    title: Principles of Finance
    publisher: OpenStax (Rice University)
    license: CC BY 4.0
    phase: 1
    domains: [finance]
    type: openstax
    slug: principles-finance
    url: https://openstax.org/details/books/principles-finance

  - id: openstax-marketing
    title: Principles of Marketing
    publisher: OpenStax (Rice University)
    license: CC BY 4.0
    phase: 1
    domains: [marketing]
    type: openstax
    slug: principles-marketing
    url: https://openstax.org/details/books/principles-marketing

  - id: openstax-management
    title: Principles of Management
    publisher: OpenStax (Rice University)
