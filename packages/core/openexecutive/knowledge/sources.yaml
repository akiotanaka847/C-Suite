  # ---- Phase 1: CC0 / US public domain ----------------------------------

  - id: nist-csf
    title: NIST Cybersecurity Framework 2.0
    publisher: National Institute of Standards and Technology (NIST)
    license: US Government public domain
    phase: 1
    domains: [operations]
    type: pdf
    url: https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf

  - id: sec-investor-guides
    title: SEC Investor Education — Beginners' Guide to Financial Statements
    publisher: US Securities and Exchange Commission
    license: US Government public domain
    phase: 1
    domains: [finance, board]
    type: html
    url: https://www.sec.gov/investor/pubs/begfinstmtguide.htm

  - id: 18f-methods
    title: 18F Methods (human-centered design playbook)
    publisher: US General Services Administration (18F)
    license: CC0 1.0
    phase: 1
    domains: [product, operations]
    type: git
    url: https://github.com/18F/methods.git
    include_globs:
      - "_methods/**/*.md"
      - "README.md"

  # ---- Phase 2: MIT (GitLab Handbook) -----------------------------------
  #
  # The full handbook is large (~hundreds of MB of markdown). We sparse-clone
  # the high-signal sub-handbooks per specialist domain. Tune include_globs
  # to expand or narrow the corpus.

  - id: gitlab-handbook
    title: GitLab Handbook
    publisher: GitLab Inc.
    license: MIT
    phase: 2
    domains: [operations, hr, finance, marketing, legal, product, strategy]
    type: git
    url: https://gitlab.com/gitlab-com/content-sites/handbook.git
    include_globs:
      - "content/handbook/people-group/**/*.md"
      - "content/handbook/finance/**/*.md"
      - "content/handbook/marketing/**/*.md"
      - "content/handbook/sales/**/*.md"
      - "content/handbook/legal/**/*.md"
      - "content/handbook/product/**/*.md"
      - "content/handbook/engineering/infrastructure/**/*.md"
      - "content/handbook/company/**/*.md"
      - "content/handbook/leadership/**/*.md"
    # Per-glob domain hints so chunks land in the right specialist's lane.
    domain_overrides:
      "content/handbook/people-group/": hr
      "content/handbook/finance/": finance
      "content/handbook/marketing/": marketing
      "content/handbook/sales/": marketing
      "content/handbook/legal/": legal
      "content/handbook/product/": product
      "content/handbook/engineering/": operations
      "content/handbook/company/": strategy
      "content/handbook/leadership/": board

  - id: sourcegraph-handbook
    title: Sourcegraph Handbook
    publisher: Sourcegraph
    license: Apache 2.0
    phase: 2
    domains: [operations, hr, strategy, product]
    type: git
    url: https://github.com/sourcegraph/handbook.git
    include_globs:
      - "content/strategy-goals/**/*.md"
      - "content/departments/people-talent/**/*.md"
      - "content/departments/product/**/*.md"
      - "content/departments/engineering/dev/**/*.md"
      - "content/company-info-and-process/**/*.md"
    domain_overrides:
      "content/strategy-goals/": strategy
      "content/departments/people-talent/": hr
      "content/departments/product/": product
      "content/departments/engineering/": operations
      "content/company-info-and-process/": operations

  - id: posthog-handbook
    title: PostHog Handbook
    publisher: PostHog
    license: MIT
    phase: 2
    domains: [product, hr, operations, marketing]
    type: git
    url: https://github.com/PostHog/posthog.com.git
    include_globs:
      - "contents/handbook/**/*.md"
      - "contents/handbook/**/*.mdx"
    domain_overrides:
      "contents/handbook/growth/": marketing
      "contents/handbook/people/": hr
      "contents/handbook/product/": product
      "contents/handbook/engineering/": operations
      "contents/handbook/company/": strategy
