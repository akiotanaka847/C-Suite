[project]
name = "csuite"
version = "0.1.0"
description = "AI-powered virtual executive team"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "C-Suite Contributors"}]
dependencies = [
    "anthropic>=1.2.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "chromadb>=1.5.9",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "click>=8.5.0",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "slack-bolt>=1.30.0",
    "discord.py>=2.7.1",
    "sentence-transformers>=6.0.1",
    "httpx>=0.28.1",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.32",
    "aiohttp>=3.14.3",
    "google-auth>=2.57.0",
    "google-api-python-client>=2.200.0",
    "mcp>=2.1.1",
    "honcho-ai>=2.4.0,<3",
    "defusedxml>=0.7.1",
    "feedparser>=6.0.14",
    # Dependencias del proxy MCP vendorizado (csuite/mcp_proxy).
    "fastmcp>=4.0.0",
    "fastembed>=0.8.0",
    "numpy>=2.4.6",
    "regopy>=1.5.2",
]

[project.urls]
Homepage = "https://github.com/akiotanaka847/C-Suite"
Repository = "https://github.com/akiotanaka847/C-Suite"
Issues = "https://github.com/akiotanaka847/C-Suite/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12.20260815",
    "types-aiofiles>=25.1.0.20260518",
]

[project.scripts]
csuite = "csuite.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csuite"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Código vendorizado: se mantiene lo más cerca posible del original para que
# integrar cambios futuros sea un diff limpio. Su cobertura son sus propios
# tests en tests/unit/mcp_proxy/, que sí corren en CI.
exclude = ["csuite/mcp_proxy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
# csuite/mcp_proxy: ver la nota en [tool.ruff]. Anotar tipos en código de
# terceros sin entenderlo a fondo arriesga cambios de comportamiento.
exclude = ["tests/", "csuite/mcp_proxy/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.13",
]
